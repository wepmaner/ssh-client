# Project configuration for the wails3 CLI (dev mode and build assets).
version: '3'

info:
  companyName: "sshclient"
  productName: "sshclient"
  productIdentifier: "sshclient"
  description: "SSH-клиент для Windows"
  copyright: "© 2026, sshclient"
  comments: ""
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .superpowers
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
