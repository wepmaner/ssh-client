name: stash-ping

# Checks the Stash CI token without building: Actions → stash-ping → Run workflow,
# or gh workflow run stash-ping. Useful after the token is issued or reissued.

on: workflow_dispatch

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_ID: ssh-client # id from stash.json
    steps:
      - name: Check the CI token
        env:
          STASH_CI_TOKEN: ${{ secrets.STASH_CI_TOKEN }}
        run: |
          code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${STASH_CI_TOKEN}" \
            "https://stash.stash-worker.workers.dev/v1/admin/refresh?app=${APP_ID}")
          cat response.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::Stash ответил ${code}: выдайте или перевыпустите CI-токен в админке Stash"
            exit 1
          fi
